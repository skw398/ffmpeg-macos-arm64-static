# Feature-only manual dispatcher; never copy this version to main.
name: build

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task on the development branch
        type: choice
        options: [build, audit, updates, sources]
        default: build
      source_run:
        description: Completed release run ID to rebuild (task=sources)
        type: string
        default: ""
      clean_build:
        description: Ignore build-output caches
        type: boolean
        default: false
      cold_build:
        description: Ignore every cache, including tools and downloads
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        type: boolean
        default: false
      cold_build:
        type: boolean
        default: false
      release_sources:
        description: Collect fixed sources for release packaging
        type: boolean
        default: false
      artifact_name:
        description: Name of the uploaded build artifact
        type: string
        default: ffmpeg-macos-arm64
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-arm64:
    if: inputs.task == '' || inputs.task == 'build'
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify FFmpeg
        uses: ./.github/actions/build
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
        with:
          clean_build: ${{ inputs.clean_build }}
          cold_build: ${{ inputs.cold_build }}
          release_sources: ${{ inputs.release_sources }}
          artifact_name: ${{ inputs.artifact_name || 'ffmpeg-macos-arm64' }}

      # Temporary: verify the adopted versions, FFmpeg patch and XEVE patch removal.
      - name: Verify security update adoption
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PYTHON' | tee build/logs/security-adoption.log
          from pathlib import Path
          import os
          import re
          import subprocess

          prefix = Path("build/prefix").resolve()
          env = os.environ | {"PKG_CONFIG_PATH": "", "PKG_CONFIG_LIBDIR": str(prefix / "lib/pkgconfig")}
          for name, expected in (("openssl", "4.0.3"), ("oapv", "1.1.3.0"), ("harfbuzz", "14.6.0")):
              actual = subprocess.check_output(["pkg-config", "--modversion", name], text=True, env=env).strip()
              installed = subprocess.check_output(["pkg-config", "--variable=prefix", name], text=True, env=env).strip()
              assert actual == expected, (name, actual, expected)
              assert Path(installed).resolve() == prefix, (name, installed)
              print(name, actual, "installed in the build prefix")
          source = Path("build/src/ffmpeg/libavcodec/liboapvenc.c").read_text()
          assert "oapvm_cdesc_t mcdsc = { 0 };" in source
          assert "oapvm_create(&mcdsc, &ret)" in source
          assert "oapvm_create(&ret)" not in source
          print("FFmpeg uses the OpenAPV API set 1 metadata descriptor")
          symbols = {}
          for library in ("libxeve.a", "liboapv.a"):
              archives = list(prefix.rglob(library))
              assert len(archives) == 1, (library, archives)
              symbols[library] = subprocess.check_output(["nm", "-gU", str(archives[0])], text=True)
          original = r"\b_sad_16b_neon_8x2n\b"
          renamed = r"\b_xeve_sad_16b_neon_8x2n\b"
          assert re.search(original, symbols["libxeve.a"]), "XEVE original helper is missing"
          assert not re.search(renamed, symbols["libxeve.a"]), "XEVE rename patch is still present"
          assert not re.search(original, symbols["liboapv.a"]), "OpenAPV still exports the conflicting helper"
          print("XEVE original NEON helper retained; OpenAPV collision absent; rename patch removed")
          PYTHON
      - name: Upload security update adoption check
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-update-adoption-check
          path: build/logs/security-adoption.log
          if-no-files-found: ignore

  maintenance:
    if: inputs.task == 'audit' || inputs.task == 'updates' || inputs.task == 'sources'
    uses: ./.github/workflows/maintenance.yml
    permissions:
      contents: read
      actions: read
    with:
      task: ${{ inputs.task }}
      source_run: ${{ inputs.source_run }}
