# Feature-only manual dispatcher; never copy this version to main.
name: build

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task on the development branch
        type: choice
        options: [build, audit, updates, sources]
        default: build
      source_run:
        description: Completed release run ID to rebuild (task=sources)
        type: string
        default: ""
      clean_build:
        description: Ignore build-output caches
        type: boolean
        default: false
      cold_build:
        description: Ignore every cache, including tools and downloads
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        type: boolean
        default: false
      cold_build:
        type: boolean
        default: false
      release_sources:
        description: Collect fixed sources for release packaging
        type: boolean
        default: false
      artifact_name:
        description: Name of the uploaded build artifact
        type: string
        default: ffmpeg-macos-arm64
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-arm64:
    if: inputs.task == '' || inputs.task == 'build'
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify FFmpeg
        uses: ./.github/actions/build
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
        with:
          clean_build: ${{ inputs.clean_build }}
          cold_build: ${{ inputs.cold_build }}
          release_sources: ${{ inputs.release_sources }}
          artifact_name: ${{ inputs.artifact_name || 'ffmpeg-macos-arm64' }}

      # Temporary: verify the libpng version and removal of shared framework output.
      - name: Verify libpng adoption
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' | tee build/logs/libpng-adoption.log
          from pathlib import Path
          import os
          import re
          import shlex
          import subprocess

          prefix = Path("build/prefix").resolve()
          build = Path("build/src/libpng/.build")
          version = "1.6.59"
          env = os.environ | {"PKG_CONFIG_PATH": "", "PKG_CONFIG_LIBDIR": str(prefix / "lib/pkgconfig")}
          def pkg(*args):
              return subprocess.check_output(["pkg-config", *args], text=True, env=env).strip()
          assert pkg("--modversion", "libpng") == version
          assert Path(pkg("--variable=prefix", "libpng")).resolve() == prefix
          header = (prefix / "include/png.h").read_text()
          assert re.search(r'#\s*define\s+PNG_LIBPNG_VER_STRING\s+"' + re.escape(version) + '"', header)
          assert (prefix / "lib/libpng16.a").is_file()
          print("libpng installed headers, pkg-config and static archive match:", version)
          cache = (build / "CMakeCache.txt").read_text()
          for option, expected in (("PNG_SHARED", "OFF"), ("PNG_FRAMEWORK", "OFF"), ("PNG_STATIC", "ON")):
              assert re.search(r"^" + option + r":BOOL=" + expected + r"$", cache, re.M), option
              print(option, "=", expected)
          assert not list(build.rglob("*.framework")), "framework exists in libpng build tree"
          assert not list(prefix.rglob("png.framework")), "png.framework exists in install prefix"
          assert not list((prefix / "lib").glob("libpng*.dylib")), "libpng dylib exists in install prefix"
          print("No libpng framework output in build tree or install prefix")
          flags = shlex.split(pkg("--static", "--libs", "aribb24"))
          assert "-lpng16" in flags, flags
          assert "-L" + str(prefix / "lib") in flags, flags
          undefined = subprocess.check_output(["nm", "-u", str(prefix / "lib/libaribb24.a")], text=True)
          assert re.search(r"\b_png_write_image\b", undefined), "libaribb24 PNG writer reference missing"
          print("libaribb24 keeps its PNG writer and prefix static link flags:", " ".join(flags))
          PY
      - name: Upload libpng adoption check
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libpng-adoption-check
          path: build/logs/libpng-adoption.log
          if-no-files-found: ignore

  maintenance:
    if: inputs.task == 'audit' || inputs.task == 'updates' || inputs.task == 'sources'
    uses: ./.github/workflows/maintenance.yml
    permissions:
      contents: read
      actions: read
    with:
      task: ${{ inputs.task }}
      source_run: ${{ inputs.source_run }}
