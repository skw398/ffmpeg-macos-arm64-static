name: build

on:
  workflow_dispatch:
    inputs:
      skip_verify:
        description: Skip pin verification (iteration only)
        type: boolean
        default: false
      clean_build:
        description: Ignore build-output caches (prefix, git sources, FFmpeg trees)
        type: boolean
        default: false
      cold_build:
        description: Ignore every cache, including pinned tools and downloads
        type: boolean
        default: false
      no_workarounds:
        description: "Trial: space/comma separated workaround ids to leave out (scripts/trial-workarounds.txt)"
        type: string
        default: ""
      trial_fast:
        description: "Trial: keep the cached prefix/FFmpeg trees and rebuild only the affected libraries (per-library ids only)"
        type: boolean
        default: false
      drop_flags:
        description: "Trial: space/comma separated lib:flag entries to leave out of that recipe (build-deps.txt data)"
        type: string
        default: ""
      install_rules:
        description: "Also run the libgsm / quirc install-rule check (bridge until workarounds.yml can be dispatched)"
        type: boolean
        default: false
      report_updates:
        description: "Also report the latest upstream version of every pinned dependency"
        type: boolean
        default: false
  # Reusable: the workarounds workflow runs one trial per id through this one.
  workflow_call:
    inputs:
      skip_verify:
        type: boolean
        default: false
      clean_build:
        type: boolean
        default: false
      cold_build:
        type: boolean
        default: false
      no_workarounds:
        type: string
        default: ""
      trial_fast:
        type: boolean
        default: false
      drop_flags:
        type: string
        default: ""
      install_rules:
        type: boolean
        default: false
      report_updates:
        type: boolean
        default: false
      artifact_suffix:
        description: Appended to the artifact name, to keep matrix runs apart
        type: string
        default: ""
  push:
    branches: [ main ]
  pull_request:

jobs:
  macos-arm64:
    # a metadata-only dispatch (report_updates) must not run the build
    if: ${{ !inputs.report_updates }}
    # Policy: newest GA arm64 image, explicit label (never macos-latest);
    # beta/preview images are not used. The runtime floor is set independently
    # via MACOSX_DEPLOYMENT_TARGET, not by the runner OS.
    runs-on: macos-26
    timeout-minutes: 350
    env:
      # Pinned Xcode (selected explicitly below); the image ships several.
      XCODE_VERSION: "26.6"
      # Pinned tool versions, installed from official distributions (not brew)
      # so the toolchain does not drift with Homebrew. Tools that cannot be
      # pinned (the runner image, Xcode/SDK, system tools) are recorded instead.
      RUST_VERSION: "1.98.1"
      CARGO_C_VERSION: "0.10.25"
      CMAKE_VERSION: "4.4.3"
      NINJA_VERSION: "1.13.2"
      MESON_VERSION: "1.12.1"
      UV_VERSION: "0.12.22"
      UV_SHA256: "5d714de09501a59393ceca78f4bc232a50478729640d251907160299b2a93ddd"
      PYTHON_VERSION: "3.14.7"
      # A trial (no_workarounds or drop_flags) must build without the
      # build-output caches and must not save any: a trial-built prefix would
      # otherwise mask the trial or poison the next normal build. The git-source
      # cache is still restored (trials reset build output in those trees).
      # trial_fast keeps the prefix/FFmpeg caches and rebuilds only the affected
      # libraries (build-deps.sh forces and then checks them); it still saves
      # nothing.
      TRIAL_RUN: ${{ inputs.no_workarounds != '' || inputs.drop_flags != '' }}
      TRIAL_FAST: ${{ inputs.trial_fast }}
      # Git-pinned sources, cached whole (their build dirs ride along). Restore
      # and save reference this one list so the two copies cannot drift.
      GIT_SRC_PATHS: |
        build/src/libunibreak
        build/src/fribidi
        build/src/harfbuzz
        build/src/brotli
        build/src/highway
        build/src/lcms2
        build/src/libudfread
        build/src/dav1d
        build/src/libaom
        build/src/SVT-AV1
        build/src/librav1e
        build/src/libvpx
        build/src/x264
        build/src/openh264
        build/src/libvvenc
        build/src/liboapv
        build/src/libxeve
        build/src/libxevd
        build/src/libvidstab
        build/src/libsnappy
        build/src/libcodec2
        build/src/liblc3
        build/src/libgme
        build/src/rubberband
        build/src/libsoxr
        build/src/libmysofa
        build/src/libwebp
        build/src/libopenjpeg
        build/src/libzimg
        build/src/libjxl
        build/src/libvmaf
        build/src/libass
        build/src/libaribb24
        build/src/libaribcaption
        build/src/libbluray
        build/src/libdvdread
        build/src/libdvdnav
        build/src/zvbi
        build/src/libssh
        build/src/libsrt
        build/src/librist
        build/src/libzmq
        build/src/librabbitmq
        build/src/libqrencode
        build/src/quirc
        build/src/libtesseract
        build/src/libflite
        build/src/SDL2
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: Select pinned Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            app=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | head -n1 || true)
          fi
          if [ ! -d "$app" ]; then
            echo "ERROR: Xcode ${XCODE_VERSION} not found; available:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$app"
          echo "== selected Xcode: $app"
          xcodebuild -version
          xcrun --show-sdk-version

      # Caches are split by nature: pinned inputs (brew bottles, tools, Rust,
      # pinned downloads) survive clean_build; build outputs (prefix, git
      # sources with their build dirs, FFmpeg trees) do not. cold_build drops
      # everything, to also validate pin fetching and tool installation.
      - name: Restore Homebrew downloads
        id: cache-brew
        if: ${{ !inputs.cold_build }}
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Install remaining build tools (brew)
        run: |
          missing=""
          for t in nasm pkgconf autoconf automake libtool gettext perl; do
            brew list --formula "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then brew install $missing; fi

      - name: Restore pinned tools cache
        id: cache-tools
        if: ${{ !inputs.cold_build }}
        uses: actions/cache/restore@v4
        with:
          path: ~/tools
          key: tools-${{ env.CMAKE_VERSION }}-${{ env.NINJA_VERSION }}-${{ env.MESON_VERSION }}-${{ env.UV_VERSION }}-${{ env.PYTHON_VERSION }}

      - name: Restore pinned Rust cache
        id: cache-rust
        if: ${{ !inputs.cold_build }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ env.RUST_VERSION }}-${{ env.CARGO_C_VERSION }}

      - name: Install pinned toolchain
        run: sh scripts/install-toolchain.sh

      - name: Save pinned tools cache
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tools
          key: tools-${{ env.CMAKE_VERSION }}-${{ env.NINJA_VERSION }}-${{ env.MESON_VERSION }}-${{ env.UV_VERSION }}-${{ env.PYTHON_VERSION }}

      - name: Save pinned Rust cache
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ env.RUST_VERSION }}-${{ env.CARGO_C_VERSION }}

      - name: Record toolchain versions
        run: |
          mkdir -p build
          sh scripts/record-toolchain.sh | tee build/toolchain-versions.txt

      - name: Save Homebrew downloads
        if: always() && steps.cache-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Restore downloads cache
        id: cache-downloads
        if: ${{ !inputs.cold_build }}
        uses: actions/cache/restore@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('deps.txt') }}
          restore-keys: downloads-

      - name: Restore prefix cache
        id: cache-prefix
        if: ${{ !inputs.clean_build && !inputs.cold_build && (env.TRIAL_RUN != 'true' || env.TRIAL_FAST == 'true') }}
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: prefix-${{ hashFiles('deps.txt') }}-${{ github.run_id }}
          restore-keys: prefix-

      - name: Restore git sources cache
        id: cache-gitsrc
        if: ${{ !inputs.clean_build && !inputs.cold_build }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GIT_SRC_PATHS }}
          key: gitsrc-${{ hashFiles('deps.txt') }}
          restore-keys: gitsrc-

      - name: Restore FFmpeg pass-1 cache
        id: cache-ffmpeg-pass1
        if: ${{ !inputs.clean_build && !inputs.cold_build && (env.TRIAL_RUN != 'true' || env.TRIAL_FAST == 'true') }}
        uses: actions/cache/restore@v4
        with:
          path: build/src/ffmpeg-pass1
          key: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}
          restore-keys: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-

      - name: Restore FFmpeg full cache
        id: cache-ffmpeg-full
        if: ${{ !inputs.clean_build && !inputs.cold_build && (env.TRIAL_RUN != 'true' || env.TRIAL_FAST == 'true') }}
        uses: actions/cache/restore@v4
        with:
          path: build/src/ffmpeg
          key: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}
          restore-keys: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-

      - name: Verify pins
        if: ${{ !inputs.skip_verify && vars.SKIP_VERIFY != 'true' }}
        run: uv run python scripts/verify-pins.py

      - name: Verify build flags
        run: uv run python scripts/verify-build-flags.py

      - name: Build dependencies
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
          NO_WORKAROUNDS: ${{ inputs.no_workarounds }}
          DROP_FLAGS: ${{ inputs.drop_flags }}
          TRIAL_FAST: ${{ inputs.trial_fast }}
        run: sh scripts/build-deps.sh

      - name: Check ambient dependencies
        run: uv run python scripts/report-ambient-deps.py

      - name: Report build flag triage
        run: uv run python scripts/report-build-flags.py

      - name: Save downloads cache
        if: always() && steps.cache-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('deps.txt') }}

      - name: Save prefix cache
        if: always() && env.TRIAL_RUN != 'true' && steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: prefix-${{ hashFiles('deps.txt') }}-${{ github.run_id }}

      - name: Save git sources cache
        if: always() && env.TRIAL_RUN != 'true' && steps.cache-gitsrc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GIT_SRC_PATHS }}
          key: gitsrc-${{ hashFiles('deps.txt') }}

      - name: FFmpeg pass 1 (for chromaprint)
        env:
          NO_WORKAROUNDS: ${{ inputs.no_workarounds }}
          DROP_FLAGS: ${{ inputs.drop_flags }}
        run: sh scripts/build-ffmpeg.sh --no-chromaprint

      - name: Save FFmpeg pass-1 cache
        if: ${{ always() && env.TRIAL_RUN != 'true' && hashFiles('build/src/ffmpeg-pass1/ffbuild/config.mak') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/src/ffmpeg-pass1
          key: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Build chromaprint
        run: sh scripts/build-chromaprint.sh

      - name: FFmpeg (full)
        env:
          NO_WORKAROUNDS: ${{ inputs.no_workarounds }}
          DROP_FLAGS: ${{ inputs.drop_flags }}
        run: sh scripts/build-ffmpeg.sh

      - name: Save FFmpeg full cache
        if: ${{ always() && env.TRIAL_RUN != 'true' && hashFiles('build/src/ffmpeg/ffbuild/config.mak') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/src/ffmpeg
          key: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Check library consumers (configure)
        run: |
          libs=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' scripts/adopted-libs.txt | tr '\n' ' ')
          uv run python scripts/lib-consumers.py --check --config-header build/src/ffmpeg $libs

      - name: Check library consumers (artifact)
        run: |
          libs=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' scripts/adopted-libs.txt | tr '\n' ' ')
          uv run python scripts/lib-consumers.py --check --binary build/prefix/bin/ffmpeg $libs

      - name: Lint workarounds
        run: uv run python scripts/lint-workarounds.py

      - name: Check buildconf
        run: sh scripts/verify-buildconf.sh

      - name: Verify build
        run: sh scripts/verify-build.sh

      - name: Collect release assets
        run: uv run python scripts/collect-release-assets.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # a trial artifact must not be mistaken for a release candidate
          name: ffmpeg-macos-arm64${{ env.TRIAL_RUN == 'true' && (env.TRIAL_FAST == 'true' && '-trial-fast' || '-trial') || '' }}${{ inputs.artifact_suffix }}
          path: |
            build/prefix/bin/ffmpeg
            build/prefix/bin/ffprobe
            build/prefix/bin/ffplay
            build/artifacts
            build/logs
            build/toolchain-versions.txt
            build/src/ffmpeg/ffbuild/config.log
            build/src/ffmpeg-pass1/ffbuild/config.log

  # libgsm / quirc: can their own install rules replace the copy build-deps.sh
  # makes? Report only (never fails). This mirrors the job in workarounds.yml,
  # which cannot be dispatched until that workflow is on the default branch;
  # drop this copy once workarounds.yml is dispatchable.
  install-rules:
    if: inputs.install_rules
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build libgsm / quirc only
        env:
          ONLY: libgsm quirc
        run: sh scripts/build-deps.sh
      - name: Check the install rules
        run: sh scripts/check-install-rules.sh

  # Report the latest upstream release/tag of every pinned dependency, so a
  # human can see what moved. Report only. ubuntu is enough: this is a metadata
  # check, not a build.
  report-updates:
    if: inputs.report_updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/report-updates.py
