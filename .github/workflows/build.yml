name: build

on:
  workflow_dispatch:
    inputs:
      skip_verify:
        description: Skip pin verification (iteration only)
        type: boolean
        default: false
  push:
    branches: [ main ]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      # Pinned tool versions, installed from official distributions (not brew)
      # so the toolchain does not drift with Homebrew. Tools that cannot be
      # pinned (the runner image, Xcode/SDK, system tools) are recorded instead.
      RUST_VERSION: "1.98.1"
      CARGO_C_VERSION: "0.10.25"
      CMAKE_VERSION: "4.4.3"
      NINJA_VERSION: "1.13.2"
      MESON_VERSION: "1.12.1"
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: Restore Homebrew downloads
        id: cache-brew
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Install remaining build tools (brew)
        run: |
          missing=""
          for t in nasm pkgconf autoconf automake libtool gettext perl; do
            brew list --formula "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then brew install $missing; fi

      - name: Restore pinned tools cache
        id: cache-tools
        uses: actions/cache/restore@v4
        with:
          path: ~/tools
          key: tools-${{ env.CMAKE_VERSION }}-${{ env.NINJA_VERSION }}-${{ env.MESON_VERSION }}

      - name: Install pinned CMake
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/tools"
          curl -sSL --fail -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/tools"

      - name: Install pinned Ninja
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/tools/ninja"
          curl -sSL --fail -o /tmp/ninja.zip \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-mac.zip"
          unzip -o /tmp/ninja.zip -d "$HOME/tools/ninja"

      - name: Install pinned Meson
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          # the runner's python3 is Homebrew-managed (PEP 668), so use a venv
          python3 -m venv "$HOME/tools/meson-venv"
          "$HOME/tools/meson-venv/bin/pip" install --quiet "meson==${MESON_VERSION}"

      - name: Add pinned tools to PATH
        run: |
          echo "$HOME/tools/cmake-${CMAKE_VERSION}-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          echo "$HOME/tools/ninja" >> "$GITHUB_PATH"
          echo "$HOME/tools/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Save pinned tools cache
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tools
          key: tools-${{ env.CMAKE_VERSION }}-${{ env.NINJA_VERSION }}-${{ env.MESON_VERSION }}

      - name: Restore pinned Rust cache
        id: cache-rust
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ env.RUST_VERSION }}-${{ env.CARGO_C_VERSION }}

      - name: Install pinned Rust
        if: steps.cache-rust.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"

      - name: Install pinned cargo-c
        if: steps.cache-rust.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-c --version "${CARGO_C_VERSION}" --locked

      - name: Add pinned Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Save pinned Rust cache
        if: steps.cache-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ env.RUST_VERSION }}-${{ env.CARGO_C_VERSION }}

      - name: Verify pinned toolchain
        run: |
          set -e
          echo "cmake: $(cmake --version | head -n1) [$(command -v cmake)]"
          echo "ninja: $(ninja --version) [$(command -v ninja)]"
          echo "meson: $(meson --version) [$(command -v meson)]"
          echo "rustc: $(rustc --version) [$(command -v rustc)]"
          echo "cargo-c: $(cargo cinstall --version 2>/dev/null || echo n/a)"
          cmake --version | head -n1 | grep -q "${CMAKE_VERSION}" || { echo "cmake version mismatch"; exit 1; }
          [ "$(ninja --version)" = "${NINJA_VERSION}" ] || { echo "ninja version mismatch"; exit 1; }
          [ "$(meson --version)" = "${MESON_VERSION}" ] || { echo "meson version mismatch"; exit 1; }
          rustc --version | grep -q "${RUST_VERSION}" || { echo "rust version mismatch"; exit 1; }

      - name: Record toolchain versions
        run: |
          mkdir -p build
          sh scripts/record-toolchain.sh | tee build/toolchain-versions.txt

      - name: Save Homebrew downloads
        if: always() && steps.cache-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Restore downloads cache
        id: cache-downloads
        uses: actions/cache/restore@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('deps.txt') }}
          restore-keys: downloads-

      - name: Restore prefix cache
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: prefix-${{ hashFiles('deps.txt') }}-${{ github.run_id }}
          restore-keys: prefix-

      - name: Restore git sources cache
        id: cache-gitsrc
        uses: actions/cache/restore@v4
        with:
          path: |
            build/src/libaom
            build/src/libvpx
          key: gitsrc-${{ hashFiles('deps.txt') }}
          restore-keys: gitsrc-

      - name: Restore FFmpeg pass-1 cache
        id: cache-ffmpeg-pass1
        uses: actions/cache/restore@v4
        with:
          path: build/src/ffmpeg-pass1
          key: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-${{ github.run_id }}
          restore-keys: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-

      - name: Restore FFmpeg full cache
        id: cache-ffmpeg-full
        uses: actions/cache/restore@v4
        with:
          path: build/src/ffmpeg
          key: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-${{ github.run_id }}
          restore-keys: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-

      - name: Verify pins
        if: ${{ !inputs.skip_verify && vars.SKIP_VERIFY != 'true' }}
        run: sh scripts/verify-pins.sh

      - name: Verify build flags
        run: sh scripts/verify-build-flags.sh

      - name: Build dependencies
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
        run: sh scripts/build-deps.sh

      - name: Save downloads cache
        if: always() && steps.cache-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('deps.txt') }}

      - name: Save prefix cache
        if: always() && steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: prefix-${{ hashFiles('deps.txt') }}-${{ github.run_id }}

      - name: Save git sources cache
        if: always() && steps.cache-gitsrc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/src/libaom
            build/src/libvpx
          key: gitsrc-${{ hashFiles('deps.txt') }}

      - name: FFmpeg pass 1 (for chromaprint)
        run: sh scripts/build-ffmpeg.sh --no-chromaprint

      - name: Save FFmpeg pass-1 cache
        if: ${{ always() && hashFiles('build/src/ffmpeg-pass1/ffbuild/config.mak') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/src/ffmpeg-pass1
          key: ffmpeg-pass1-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-${{ github.run_id }}

      - name: Build chromaprint
        run: sh scripts/build-chromaprint.sh

      - name: FFmpeg (full)
        run: sh scripts/build-ffmpeg.sh

      - name: Save FFmpeg full cache
        if: ${{ always() && hashFiles('build/src/ffmpeg/ffbuild/config.mak') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/src/ffmpeg
          key: ffmpeg-full-${{ hashFiles('deps.txt', 'scripts/build-ffmpeg.sh') }}-${{ github.run_id }}

      - name: Check library consumers
        run: |
          libs=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' scripts/adopted-libs.txt | tr '\n' ' ')
          sh scripts/lib-consumers.sh --check --config-header build/src/ffmpeg $libs

      - name: Check buildconf
        run: sh scripts/verify-buildconf.sh

      - name: Verify build
        run: sh scripts/verify-build.sh

      - name: Collect release assets
        run: sh scripts/collect-release-assets.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: |
            build/prefix/bin/ffmpeg
            build/prefix/bin/ffprobe
            build/prefix/bin/ffplay
            build/artifacts
            build/logs
            build/toolchain-versions.txt
            build/src/ffmpeg/ffbuild/config.log
            build/src/ffmpeg-pass1/ffbuild/config.log
