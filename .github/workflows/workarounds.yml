name: workarounds

# Checks that need an *extra build* (an experiment), kept out of the build
# workflow: one trial per workaround id, plus the libgsm / quirc install rules.
# See docs/BUILD-WORKAROUNDS.md ("検知の実装").
#
# Triggers:
#   - a push that changes deps.txt -> the per-library trials whose library's pin
#     changed (fast trial, ~7 min each)
#   - manual dispatch              -> any subset (including the global ids, which
#     cannot use a fast trial)
#
# No schedule: when these run is a separate decision. plan-workaround-runs.py
# already understands EVENT=schedule, so a schedule can be added later.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Trial ids, space/comma separated (empty = decide from the trigger)"
        type: string
        default: ""
      drop_flags:
        description: "Trial per-library flags from the data: space/comma separated lib:flag entries"
        type: string
        default: ""
      install_rules:
        description: "Also run the install-rule check (libgsm / quirc)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: [ deps.txt ]

jobs:
  # Decide what to run: the ids whose library's pin changed (push), the global
  # ids (schedule), or whatever was asked for (manual dispatch).
  plan:
    runs-on: ubuntu-latest
    outputs:
      trials: ${{ steps.plan.outputs.trials }}
      install_rules: ${{ steps.plan.outputs.install_rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned uv and Python
        env:
          UV_VERSION: "0.12.22"
          UV_SHA256: "b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b"
        run: |
          uv_dir="$RUNNER_TEMP/uv-$UV_VERSION"
          mkdir -p "$uv_dir"
          curl -sSL --fail -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$uv_dir" --strip-components=1
          echo "$uv_dir" >> "$GITHUB_PATH"
          "$uv_dir/uv" python install
      # Temporary: retain the shell baseline until the migration is verified.
      - name: Compare shell and Python plan outputs
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          cases = [
              ("default", {}),
              ("manual", {"EVENT": "workflow_dispatch", "INPUT_TRIALS": "quirc-sdl-cflags, size-t-preinclude,quirc-sdl-cflags unknown"}),
              ("manual whitespace", {"INPUT_TRIALS": "\tffmpeg-extra-libs\nquirc-sdl-cflags,,"}),
              ("install", {"INPUT_INSTALL": "true"}),
              ("install case", {"INPUT_INSTALL": "TRUE"}),
              ("schedule", {"EVENT": "schedule"}),
              ("push without before", {"EVENT": "push"}),
              ("push zero before", {"EVENT": "push", "BEFORE": "0000000000000000000000000000000000000000"}),
              ("push invalid before", {"EVENT": "push", "BEFORE": "invalid-ref"}),
              ("push previous commit", {"EVENT": "push", "BEFORE": "HEAD~1"}),
              ("unknown event", {"EVENT": "unknown"}),
          ]
          baseline = {key: value for key, value in os.environ.items()
                      if key not in {"EVENT", "BEFORE", "INPUT_TRIALS", "INPUT_INSTALL", "GITHUB_OUTPUT"}}
          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory) / "output"
              for name, inputs in cases:
                  for to_file in (False, True):
                      results = []
                      for command in (["sh", "scripts/plan-workaround-runs.sh"],
                                      [sys.executable, "scripts/plan-workaround-runs.py"]):
                          output.write_text("existing=value\n")
                          env = baseline | inputs
                          if to_file:
                              env["GITHUB_OUTPUT"] = str(output)
                          run = subprocess.run(command, env=env, capture_output=True)
                          results.append((run.returncode, run.stdout, run.stderr, output.read_bytes()))
                      assert results[0] == results[1], (name, to_file, results)
                      assert results[0][0] == 0, (name, results[0])
                      print(f"ok: {name}, GITHUB_OUTPUT={to_file} (stdout, stderr, exit code, output file)")
                      if not to_file:
                          print(results[0][1].decode(), end="")
          PY
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_TRIALS: ${{ inputs.trials }}
          INPUT_INSTALL: ${{ inputs.install_rules }}
        run: uv run python scripts/plan-workaround-runs.py

  # Trial one or more per-library flags from build-deps.txt (no id needed).
  drop-flags:
    if: inputs.drop_flags != ''
    uses: ./.github/workflows/build.yml
    with:
      drop_flags: ${{ inputs.drop_flags }}
      trial_fast: true
      artifact_suffix: -drop-flags

  # One trial per id, each in its own runner (build.yml is reusable).
  trials:
    needs: plan
    if: needs.plan.outputs.trials != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.trials) }}
    uses: ./.github/workflows/build.yml
    with:
      no_workarounds: ${{ matrix.id }}
      trial_fast: ${{ matrix.fast }}
      artifact_suffix: -${{ matrix.id }}

  # Can libgsm's and quirc's own install rules replace the copies we do?
  install-rules:
    needs: plan
    if: needs.plan.outputs.install_rules == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build libgsm / quirc only
        env:
          ONLY: libgsm quirc
        run: sh scripts/build-deps.sh
      - name: Check the install rules
        run: sh scripts/check-install-rules.sh
