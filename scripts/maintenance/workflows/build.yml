# Feature-only manual dispatcher; never copy this version to main.
name: build

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task on the development branch
        type: choice
        options: [build, audit, updates, sources]
        default: build
      source_run:
        description: Completed release run ID to rebuild (task=sources)
        type: string
        default: ""
      clean_build:
        description: Ignore build-output caches
        type: boolean
        default: false
      cold_build:
        description: Ignore every cache, including tools and downloads
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        type: boolean
        default: false
      cold_build:
        type: boolean
        default: false
      release_sources:
        description: Collect fixed sources for release packaging
        type: boolean
        default: false
      artifact_name:
        description: Name of the uploaded build artifact
        type: string
        default: ffmpeg-macos-arm64
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-arm64:
    if: inputs.task == '' || inputs.task == 'build'
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify FFmpeg
        uses: ./.github/actions/build
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
        with:
          clean_build: ${{ inputs.clean_build }}
          cold_build: ${{ inputs.cold_build }}
          release_sources: ${{ inputs.release_sources }}
          artifact_name: ${{ inputs.artifact_name || 'ffmpeg-macos-arm64' }}

      # Temporary: verify removal of the archive-flattening workaround.
      - name: Verify EVC static archive search paths
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/build/prefix"
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
          for library in xeve xevd; do
            test -f "$prefix/lib/$library/lib$library.a"
            test ! -e "$prefix/lib/lib$library.a"
            flags=$(pkg-config --static --libs "$library")
            printf '%s: %s\n' "$library" "$flags"
            case " $flags " in
              *" -L$prefix/lib/$library "*) ;;
              *) echo "ERROR: missing static archive search path for $library" >&2; exit 1 ;;
            esac
          done

      # Temporary: check the specific integration changes when adopting OpenSSL 4.
      - name: Verify OpenSSL 4 adoption
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' | tee build/logs/openssl4-adoption.log
          from pathlib import Path
          import os
          import re
          import subprocess

          prefix = Path("build/prefix").resolve()
          version = "4.0.3"
          def run(*args, **kwargs):
              return subprocess.check_output(args, text=True, **kwargs).strip()
          text = run(str(prefix / "bin/openssl"), "version")
          assert text.startswith(f"OpenSSL {version} "), text
          print(text)
          header = (prefix / "include/openssl/opensslv.h").read_text()
          assert re.search(r'#\s*define\s+OPENSSL_VERSION_STR\s+"' + re.escape(version) + '"', header)
          env = {"PATH": os.environ["PATH"], "PKG_CONFIG_PATH": "",
                 "PKG_CONFIG_LIBDIR": str(prefix / "lib/pkgconfig")}
          assert run("pkg-config", "--modversion", "openssl", env=env) == version
          print("OpenSSL installed headers and pkg-config match:", version)
          for name in ("libssh", "librabbitmq"):
              cache = Path(f"build/src/{name}/.build/CMakeCache.txt").read_text()
              for variable, expected in (("OPENSSL_INCLUDE_DIR", prefix / "include"),
                                         ("OPENSSL_CRYPTO_LIBRARY", prefix / "lib/libcrypto.a")):
                  match = re.search(r"^" + variable + r":[^=]+=(.*)$", cache, re.M)
                  assert match and Path(match[1]).resolve() == expected, (name, variable, match)
              print(name, "uses prefix OpenSSL headers and static crypto library")
          for name, relative, macro in (
              ("libssh", "config.h", "WITH_PKCS11_URI"),
              ("librabbitmq", "librabbitmq/config.h", "ENABLE_SSL_ENGINE_API"),
          ):
              config = Path(f"build/src/{name}/.build/{relative}").read_text()
              assert not re.search(r"^\s*#\s*define\s+" + macro + r"\b", config, re.M), (name, macro)
              print(name, macro, "is disabled by upstream configuration")
              archive = prefix / "lib" / ("libssh.a" if name == "libssh" else "librabbitmq.a")
              undefined = run("nm", "-u", str(archive))
              assert not re.search(r"\b_ENGINE_\w+", undefined), name
              print(name, "has no undefined ENGINE API symbols")
          cache = Path("build/src/libsrt/.build/CMakeCache.txt").read_text()
          assert re.search(r"^USE_ENCLIB:[^=]+=openssl-evp$", cache, re.M)
          print("SRT keeps its adopted OpenSSL EVP backend")
          PY
      - name: Upload OpenSSL adoption check
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openssl4-adoption-check
          path: build/logs/openssl4-adoption.log
          if-no-files-found: ignore

  maintenance:
    if: inputs.task == 'audit' || inputs.task == 'updates' || inputs.task == 'sources'
    uses: ./.github/workflows/maintenance.yml
    permissions:
      contents: read
      actions: read
    with:
      task: ${{ inputs.task }}
      source_run: ${{ inputs.source_run }}
