# Feature-only manual dispatcher; never copy this version to main.
name: build

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task on the development branch
        type: choice
        options: [build, audit, updates, sources]
        default: build
      source_run:
        description: Completed release run ID to rebuild (task=sources)
        type: string
        default: ""
      clean_build:
        description: Ignore build-output caches
        type: boolean
        default: false
      cold_build:
        description: Ignore every cache, including tools and downloads
        type: boolean
        default: false
  workflow_call:
    inputs:
      clean_build:
        type: boolean
        default: false
      cold_build:
        type: boolean
        default: false
      release_sources:
        description: Collect fixed sources for release packaging
        type: boolean
        default: false
      artifact_name:
        description: Name of the uploaded build artifact
        type: string
        default: ffmpeg-macos-arm64
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-arm64:
    if: inputs.task == '' || inputs.task == 'build'
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify FFmpeg
        uses: ./.github/actions/build
        env:
          FORCE_REBUILD: ${{ vars.FORCE_REBUILD }}
        with:
          clean_build: ${{ inputs.clean_build }}
          cold_build: ${{ inputs.cold_build }}
          release_sources: ${{ inputs.release_sources }}
          artifact_name: ${{ inputs.artifact_name || 'ffmpeg-macos-arm64' }}

  maintenance:
    if: inputs.task == 'audit' || inputs.task == 'updates' || inputs.task == 'sources'
    uses: ./.github/workflows/maintenance.yml
    permissions:
      contents: read
      actions: read
    with:
      task: ${{ inputs.task }}
      source_run: ${{ inputs.source_run }}
