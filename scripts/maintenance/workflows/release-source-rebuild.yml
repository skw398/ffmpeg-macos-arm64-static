
  # Feature-only job fragment, appended to the normal release workflow.
  # The uploaded source package is rebuilt after successful dry-run packaging.
  source-rebuild:
    needs: [package, verify-runtime]
    if: inputs.dry_run
    uses: ./.github/workflows/maintenance.yml
    permissions:
      contents: read
      actions: read
    with:
      task: sources
      source_run: ${{ format('{0}', github.run_id) }}
